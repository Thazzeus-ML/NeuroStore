# Pre-registered gates. Thresholds here are read by the experiment scripts
# (eval/gates.py). A phase's table is committed BEFORE any experiment for that
# phase runs. Thresholds are never edited after the fact; a failed gate stays failed.
#
# Seeds: gate runs use seeds 0..4 (n_seeds = 5). Seeds >= 100 are "dev seeds" used for
# debugging and hyper-parameter choice; they never appear in gate numbers.

[global]
gate_seeds = [0, 1, 2, 3, 4]
dev_seeds  = [100, 101, 102]

[phase0]
# Gate 0: generator is deterministic per seed and matches its documented statistics.
description = "generator determinism + documented statistics"
n_events_stats          = 50000
determinism_seeds       = [0, 1, 2, 3, 4]
tol_mean_concepts_rel   = 0.02   # |empirical - 1.5| / 1.5
tol_mean_features_rel   = 0.03   # single-concept events, vs analytic M*p + noise*(1-M*p/F)
tol_chain_tv            = 0.03   # TV distance, empirical primary-concept freq vs stationary dist
tol_self_transition_abs = 0.015  # P(primary_{t+1}==primary_t) vs analytic sum_i pi_i P_ii
drift_members_exact     = true   # exactly round(drift_frac*M) members replaced per concept
require_all_seeds       = true   # every one of the 5 seeds must satisfy every criterion

[phase1]
# Gate 1: determinism and bounded bytes per event hold. Overlap is reported, with a
# minimum same-vs-different margin that must hold on every seed.
# Default code geometry (fixed before running): N=1024 units, k=32 active (3.1%), each raw
# feature projects to d=2 units.
description = "exactly-k, determinism, bytes/event depends on k only, same>diff overlap"
n_events                 = 3000
N                        = 1024
k                        = 32
d                        = 2
exact_k_fraction         = 1.0    # fraction of events with exactly k distinct units
determinism_mismatches   = 0      # identical seed => byte-identical log; encode(x) twice identical
bytes_per_event_formula  = "8 + 4*k"   # volley: event_id u32 + t f32 + k*(unit u16 + strength u8 + surprise u8)
bytes_per_event_tol      = 0.0         # exact: stored bytes/event must equal the formula
raw_feature_regimes      = [200, 800, 3200]  # F values; bytes/event must be identical across them
k_values                 = [16, 32, 64]      # bytes/event must follow the formula for each k
overlap_margin_min       = 0.10   # mean(same-concept overlap) - mean(different-concept overlap), every seed
overlap_pairs            = 20000

[phase2]
# Gate 2: partial-cue recovery. Per seed: default world (no drift, uniform popularity), encoder
# with theta = 0 (no homeostasis), UNGATED log, no synapses yet. NeuroStore learns assemblies
# in one pass over the train stream (batch consolidation, every event replayed).
# Test events are held out; a fraction `mask` of each test code's active units is removed at
# random (seeded) and the rest is the cue.
#   (a) concept recovery: mean set-F1 of recovered vs true concept set (1-3 concepts).
#   (b) masked-unit recovery: precision@m, m = number of masked units; completion excludes cue units.
# Ground-truth labels are used only to NAME clusters/neighbours (assembly -> concept map, and the
# labels of neighbours) -- identically for NeuroStore and the references.
# Read-out hyper-parameters (grids fixed here) are chosen per mask level on the VALIDATION stream.
# Competitors: exact-match = hash of the cue code looked up among hashes of full stored codes
# (miss -> global majority fallback); reference = brute-force Jaccard kNN (k_nn and vote threshold
# chosen on validation) over all stored train codes.
description = "assembly vote vs exact-match and brute-force Jaccard-kNN under partial cues"
n_train = 6000
n_val   = 1000
n_test  = 1500
masks   = [0.3, 0.5, 0.7]
# Pass conditions, BOTH metrics at EVERY mask level, mean over seeds 0-4:
beat_exact_margin_abs   = 0.05          # NS metric >= exact-match metric + margin, on the mean AND on every seed
approach_ratio          = {"0.3" = 0.90, "0.5" = 0.90, "0.7" = 0.80}   # NS metric >= ratio * kNN-reference metric (mean over seeds)
# cost (query latency, index bytes, build time) is reported, not gated.
grid_ns_rho        = [0.5, 0.7, 0.85]
grid_ns_cos_min    = [0.05, 0.10, 0.15, 0.20]
grid_ns_map_thr    = [0.3, 0.5]
grid_ns_complete_a = [1, 2, 3]
grid_nn_k          = [1, 3, 5, 10]
grid_nn_vote_thr   = [0.3, 0.5, 0.7]

[phase3]
# Gate 3: top-k next-unit prediction on the held-out test stream.
# Per seed: default world (no drift, uniform popularity), train 6000 / val 1000 / test 1500 events.
# NeuroStore: homeostasis off, UNGATED log, assemblies on, Hebbian lattice on, batch consolidation
# (every 200 events, every event replayed, merge delta->lattice every 2 rounds), lambda = 0.03 per
# epoch (fixed, not tuned). Model is frozen at test time.
# Task: for each consecutive test pair (event t -> event t+1) give the full code of event t and
# predict the k=32 units of event t+1; metric = recall@k = |top-32 predicted ∩ actual next units| / 32.
# Baselines are trained on the same train codes: (1) global unit frequency, (2) first-order unit
# bigram (counts over consecutive train pairs; score = sum over active units of row-normalised counts;
# raw-count variant also tried, better of the two on validation is used).
# NeuroStore read parameters chosen per seed on the validation stream from the grids below.
# Pass: mean recall@k of NeuroStore exceeds BOTH baselines by >= margin on the mean over seeds, AND is
# higher than each baseline on >= min_seed_wins of 5 seeds.
# Unit tests (not gates): lazy decay == eager decay (rtol 1e-4); lattice+delta reads == merged lattice reads.
# Reported, not gated: oracle ceiling; behaviour after the drift point (separate drift run).
description = "temporal readout vs global-frequency and bigram baselines"
n_train = 6000
n_val   = 1000
n_test  = 1500
recall_margin_abs = 0.01
min_seed_wins     = 4
grid_hops         = [1, 2]
grid_lagged_only  = [false, true]
grid_normalize    = [true, false]

[phase4]
# Gate 4: the surprise gate saves bytes without hurting phase-2 recall.
# Per seed, default world, train 6000 / val 1000 / test 1500. Two systems, identical except for the gate:
#   ungated: gate = false  (every event stored with full volley)
#   gated  : gate = true   (events with surprise <= tau logged as a count only; stored strength scaled by
#                           max(floor, surprise))
# Both: homeostasis OFF (isolates the gate; homeostasis has its own test below), assemblies + Hebbian lattice
# ON, batch consolidation every 200 events with replay_budget = 150 and hot_tau = 0.3 (hot replay active).
# Bytes written = spike-log bytes (8 + 4k per stored event; count-only events cost 0).
# Recall = the phase-2 task at mask 0.5 (concept set-F1 and masked-unit precision@m) on the held-out test
# stream, read-out hyper-parameters chosen on validation per system with the phase-2 grids. Assembly -> concept
# naming uses only the STORED training events.
# tau is chosen per seed on the validation stream from tau_grid: the LARGEST tau whose validation recall
# (both metrics) is within tolerance of the ungated system's validation recall; if none qualifies, the smallest.
# Pass (all three): mean over seeds 0-4 of
#   (1 - bytes_gated/bytes_ungated) >= bytes_reduction_min
#   F1_ungated  - F1_gated  <= recall_tolerance_abs
#   P@m_ungated - P@m_gated <= recall_tolerance_abs
description = "surprise gate: bytes written vs phase-2 recall"
n_train = 6000
n_val   = 1000
n_test  = 1500
mask    = 0.5
tau_grid = [0.15, 0.25, 0.35, 0.45, 0.55]
strength_floor = 0.25
replay_budget  = 150
hot_tau        = 0.3
recall_tolerance_abs = 0.02
bytes_reduction_min  = 0.20

[phase4.homeostasis_test]
# Test (also run by the bench script): Zipf-skewed world, thresholds adapt, per-unit firing rates in the last
# `last_window` events must be more uniform than without homeostasis, and k must be exactly fixed.
zipf_s = 1.5
n_events = 8000
last_window = 2000
cv_ratio_max = 0.7        # CV(rates | homeostasis) <= 0.7 * CV(rates | none), every seed

[phase5]
# Gate 5 (reporting gate): implement the layouts behind one interface with IDENTICAL outputs (property-tested in
# tests/test_layouts.py), measure the workloads below, and state plainly which hypotheses held.
# PASS = equivalence tests pass AND every workload below was measured on all 5 seeds AND REPORT.md states a
# HELD / NOT HELD verdict per hypothesis. A hypothesis failing does NOT fail the gate; it is reported as NOT HELD.
#
# Pre-registered hypotheses (compared inside the stated group of layouts):
#   H1a volley tiles win event-local reads       : workloads rebuild_single, rebuild_batch ; group {aos, soa, volley}
#   H1b volley tiles win footprint               : workload footprint_bytes (logical bytes) ; group {aos, soa, volley}
#   H2  plain SoA wins single-field scans        : workload scan_field (sum of strength over all spikes) ; group {aos, soa, volley}
#   H3a CSR wins out-edge scans                  : workload out_edge_scan ; group {csr, dict}
#   H3b CSR wins sparse accumulate over synapses : workload sparse_accumulate (32 active units) ; group {csr, dict}
# Decision rule ("wins"): the predicted layout has the lowest pooled median AND is at least min_margin faster
# (or smaller) than the runner-up AND has the lowest per-seed median on at least min_seed_wins of 5 seeds.
# The soa_event control (event_id/t stored once per event) is measured and reported but is NOT a competitor in H1/H2:
# it exists to show what part of any volley win comes from the tiling itself.
# Also measured and reported, no hypothesis: append, per-unit history (full scan vs postings), postings build time and
# bytes, in-edge reads, graph bytes (CSR with transposed index vs dict-of-dicts measured with tracemalloc).
# Timings: medians (and IQR) over repeats pooled across 5 data seeds. NumPy timings are relative, not absolute.
description = "layout hypotheses"
n_events = 200000
k = 32
zipf_s = 1.0
n_append = 20000
repeats = 15
repeats_append = 5
graph_out_degree = 128
min_margin = 0.10
min_seed_wins = 4

[phase6]
# Phase 6 (ablation, reporting gate): rerun the phase 2-4 metrics (plus rate and surprise read-outs) with each
# principle removed in turn. FULL system: k=32, homeostasis, surprise gate (tau fixed below, assembly-persistence
# expectation), Hebbian lattice, batch consolidation with hot replay. Variants: no_sparsity (k=256, d=16),
# no_surprise_gate, no_hebbian, no_homeostasis, no_consolidation (immediate per-event learning, no replay/hot
# selection), plus the no_learning_floor reference. Worlds: uniform (all variants) and Zipf s=1.0
# (full vs no_homeostasis only). 5 seeds (0-4); train 6000 / val 1000 / test 1500 / extra 1500 (3% anomaly events).
# Metrics: f1 and prec_lift (phase-2 task, mask 0.5; prec_lift = (P@m - chance)/(1 - chance)), temporal_lift
# (phase-3 task; (recall - k/N)/(1 - k/N)), log_bytes_per_event, rate_cv (CV of per-unit firing rates),
# overlap_margin (same - different concept code overlap on the test stream), surprise_auc (AUC of stored surprise
# for anomaly events), rate_readout_corr (assembly rate readout vs true concept counts per tumbling window),
# mean_surprise, n_assemblies.
# DEPENDENCE RULE (a metric "depends on" a principle): the paired difference (variant - full) over seeds has
# |mean| >= threshold (absolute for rates/lifts/AUC, relative to full for bytes/cv/n_assemblies) AND the same sign on
# >= min_seed_agree of 5 seeds. Gate 6 PASS = every variant x metric x seed measured and every dependence verdict
# plus every expectation below reported as met / not met. Expectations are the author's predictions, written
# before running; they can fail.
description = "ablations"
n_train = 6000
n_val = 1000
n_test = 1500
n_extra = 1500
mask = 0.5
gate_tau = 0.55
anomaly_rate = 0.03
zipf_s = 1.0
threshold_abs = 0.01
min_seed_agree = 4
lower_is_better = ["log_bytes_per_event", "rate_cv", "mean_surprise", "n_assemblies"]

[phase6.threshold_rel]
log_bytes_per_event = 0.10
rate_cv = 0.25
n_assemblies = 0.25

[[phase6.expect]]
world = "uniform"
variant = "no_sparsity"
metric = "f1"
claim = "hurts"
[[phase6.expect]]
world = "uniform"
variant = "no_sparsity"
metric = "overlap_margin"
claim = "hurts"
[[phase6.expect]]
world = "uniform"
variant = "no_surprise_gate"
metric = "log_bytes_per_event"
claim = "hurts"
[[phase6.expect]]
world = "uniform"
variant = "no_surprise_gate"
metric = "f1"
claim = "no_dependence"
[[phase6.expect]]
world = "uniform"
variant = "no_surprise_gate"
metric = "temporal_lift"
claim = "no_dependence"
[[phase6.expect]]
world = "uniform"
variant = "no_hebbian"
metric = "temporal_lift"
claim = "hurts"
[[phase6.expect]]
world = "uniform"
variant = "no_hebbian"
metric = "surprise_auc"
claim = "hurts"
[[phase6.expect]]
world = "uniform"
variant = "no_hebbian"
metric = "f1"
claim = "no_dependence"
[[phase6.expect]]
world = "uniform"
variant = "no_homeostasis"
metric = "rate_cv"
claim = "hurts"
[[phase6.expect]]
world = "zipf"
variant = "no_homeostasis"
metric = "rate_cv"
claim = "hurts"
[[phase6.expect]]
world = "uniform"
variant = "no_consolidation"
metric = "f1"
claim = "hurts"
[[phase6.expect]]
world = "uniform"
variant = "no_consolidation"
metric = "temporal_lift"
claim = "hurts"
